name: Flutter Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android Gradle project
        run: bash scripts/prepare_android.sh

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION" && [[ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]]; then
              echo "Android NDK $NDK_VERSION installed successfully."
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep 15; fi
          done
          echo "Failed to install Android NDK $NDK_VERSION after 3 attempts."
          exit 1

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build arm64-v8a release APK
        run: flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols

      - name: Report APK size
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload arm64-v8a debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: xp-p323b-arm64-v8a-symbols
          path: build/symbols/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: xp-p323b-arm64-v8a-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
