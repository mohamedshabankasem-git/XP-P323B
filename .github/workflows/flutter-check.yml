name: Flutter checks
on:
  push:
    branches: [main, feature/flutter-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform if missing
        run: |
          if [ ! -f android/gradlew ]; then flutter create --platforms=android --org com.xpprinter .; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xp-p323b-arm64-v8a-release-check
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
