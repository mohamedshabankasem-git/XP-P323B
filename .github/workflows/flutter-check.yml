name: Flutter checks
on:
  push:
    branches: [main, feature/flutter-foundation]
  pull_request:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform if missing
        run: |
          if [ ! -f android/gradlew ]; then flutter create --platforms=android --org com.xpprinter .; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
